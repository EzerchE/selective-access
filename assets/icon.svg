<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Automatic Access</title>
  <desc id="description">A shield with a keyhole cut through it: the target that was blocked is reachable again</desc>
  <defs>
    <linearGradient id="surface" x1="24" y1="16" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2FBFA4"/>
      <stop offset="1" stop-color="#10453C"/>
    </linearGradient>
  </defs>
  <!-- One silhouette, drawn as a single evenodd path so the keyhole is a real
       hole rather than a second shape. That is what keeps it open at 16px,
       where a toolbar icon actually lives. The gradient runs light to dark
       across the diagonal so the mark clears the 3:1 contrast floor against
       both the light and the dark Chrome toolbar. -->
  <path fill-rule="evenodd" fill="url(#surface)" d="M22 27c0-4 2-7 6-8l32-7c2-1 6-1 8 0l32 7c4 1 6 4 6 8v38c0 31-21 47-42 55-21-8-42-24-42-55z M64 44c-8 0-15 7-15 15 0 5 3 10 7 13l-4 16c-1 3 1 5 4 5h16c3 0 5-2 4-5l-4-16c4-3 7-8 7-13 0-8-7-15-15-15z"/>
</svg>
