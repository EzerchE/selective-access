<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Automatic Access</title>
  <desc id="description">The bending route mark from the full icon, simplified for 16 and 32 pixel rendering</desc>
  <defs>
    <linearGradient id="surface" x1="20" y1="14" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176354"/>
      <stop offset="1" stop-color="#103D35"/>
    </linearGradient>
  </defs>
  <!-- Same tile and route geometry as icon.svg so the silhouette matches at
       every size. Dropped for small renders: the drop shadow, the dashed
       blocked path and the cross. Below 32px each of those is under two pixels
       wide and only muddies the one shape that still reads, the route, which is
       thickened here to hold its weight. -->
  <rect x="8" y="8" width="112" height="112" rx="31" fill="url(#surface)"/>
  <path d="M28 91h39c13 0 21-8 21-21V53c0-11 4-17 12-17" fill="none" stroke="#7BE3C7" stroke-linecap="round" stroke-linejoin="round" stroke-width="15"/>
  <circle cx="28" cy="91" r="8" fill="#7BE3C7"/>
  <circle cx="100" cy="36" r="8" fill="#7BE3C7"/>
</svg>
