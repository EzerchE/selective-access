name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Syntax and tests
        run: |
          node --check background.js
          node --check i18n.js
          node --check popup-preview.js
          node --check popup.js
          node tests/background.test.cjs
          node tests/popup.test.cjs
          node tests/helper-migration.test.cjs
      - name: Sensitive data audit
        run: node scripts/repository-audit.cjs --history
      - name: Store package
        run: node scripts/build-store-zip.cjs
