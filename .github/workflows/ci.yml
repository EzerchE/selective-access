name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax and tests
        shell: pwsh
        run: |
          node --check background.js
          node --check popup.js
          node tests/background.test.cjs
      - name: Sensitive data audit
        shell: pwsh
        run: ./scripts/repository-audit.ps1
